[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balash"
version = "0.1.0"
description = "Balash: an AI supervision toolkit of software blocks and model harness blocks, composed by configuration."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "matplotlib>=3.11",
    "python-bidi>=0.5",
    "jsonschema>=4.20",
    "pyyaml>=6",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
balash = "balash.cli:main"

[tool.setuptools.packages.find]
include = ["balash*"]

[tool.setuptools.package-data]
balash = ["harness_blocks/*/*.md", "harness_blocks/*/*.yaml", "harness_blocks/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
