pipeline: groceries_ingest
description: >
  A shopping document arrives over WhatsApp or from a local file (receipt,
  grocery tab slip, payment receipt or account statement). Read it into
  records, save them, categorize new products, check the grocery tab, and
  tell the sender what was read.
trigger: incoming_document

steps:
  - id: inbox
    block: receipt_inbox              # WhatsApp message -> receipt records:
                                      # allowed senders only, download, store once, model reads it
    # allowed_senders: ["9725XXXXXXXX"]   # default: owners in instance.yaml
    # model: claude-opus-5-5              # default: the instance default model

  - id: ledger
    block: purchase_ledger            # software: save, resolve store, skip duplicates
    input: inbox

  - id: categories
    block: categorize_items           # harness: only products never seen before
    input: ledger

  - id: tab
    block: tab_continuity             # software: consecutive slips must agree
    input: ledger
    tolerance: 0.5

  - id: statement
    block: statement_reconcile        # software: every statement charge needs a slip
    input: ledger
    date_window_days: 1
    amount_tolerance: 0.5

  - id: ack
    block: receipt_ack                # software: what was read
    input: [inbox, ledger]

  - id: alerts
    block: finding_messages           # software: alerts, most severe first
    input: [tab, statement]
    min_severity: low

  - id: send
    block: notify
    input: [ack, alerts]
